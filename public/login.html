<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechNest - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <form id="loginForm" class="card login-card">
    <h1>Tech<span>Nest</span></h1>
    <p class="sub">Sign in to continue</p>
    <input id="username" placeholder="Username" autocomplete="username" required>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="primary" type="submit">Login</button>
    <p id="err" class="err"></p>
  </form>
  <script>
    if (sessionStorage.getItem('token')) location.href = '/';
    document.getElementById('loginForm').onsubmit = async e => {
      e.preventDefault();
      const err = document.getElementById('err'); err.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username.value.trim(), password: password.value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        sessionStorage.setItem('token', data.token);
        sessionStorage.setItem('user', data.username);
        location.href = '/';
      } catch (ex) { err.textContent = ex.message; }
    };
  </script>
</body>
</html>
