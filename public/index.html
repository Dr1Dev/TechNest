<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechNest - Computer Retail Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo">Tech<span>Nest</span></div>
    <nav>
      <button class="nav active" data-tab="pos">🛒 POS Checkout</button>
      <button class="nav" data-tab="inventory">📦 Inventory</button>
      <button class="nav" data-tab="sales">🧾 Sales History</button>
    </nav>
    <button class="nav logout" id="logoutBtn">⎋ Logout</button>
  </aside>

  <div class="content">
    <div class="topbar">
      <input id="searchBox" type="search" placeholder="Search product...">
      <button id="newSale" class="pill">＋ New Sale</button>
      <div class="user"><span class="avatar" id="avatar"></span><div><b id="uname"></b><small>Cashier</small></div></div>
    </div>
    <div id="toast"></div>

    <section id="pos" class="panel active">
      <div class="pos-layout">
        <div class="left">
          <div id="cats" class="cats"></div>
          <div id="productGrid" class="grid"></div>
        </div>
        <aside class="summary">
          <h2>Order's Summary</h2>
          <div class="row"><span class="muted">Total Items (<span id="itemCount">0</span>)</span><span class="badge">In Progress</span></div>
          <div id="cartItems" class="cart-items"></div>
          <div class="pay">
            <button class="pm" data-pm="QR">QR</button>
            <button class="pm active" data-pm="Cash">Cash</button>
            <button class="pm" data-pm="Wallet">Wallet</button>
          </div>
          <div class="row"><span class="muted">Subtotal</span><span id="subtotal">$0.00</span></div>
          <div class="row"><span class="muted">Discount %</span><input id="discount" type="number" min="0" max="100" step="0.5" value="0" style="width:90px;text-align:right"></div>
          <div class="row"><span class="muted">You save</span><span id="discAmt">-$0.00</span></div>
          <div class="total"><span>Total</span><span id="total">$0.00</span></div>
          <div class="actions">
            <button id="clearBtn" class="btn-cancel">Cancel</button>
            <button id="completeBtn" class="btn-ok">Confirm Order</button>
          </div>
        </aside>
      </div>
    </section>

    <section id="inventory" class="panel">
      <div class="card">
        <h2 id="formTitle">Add New Product</h2>
        <form id="productForm" class="form-row">
          <input id="pName" placeholder="Product name" required>
          <select id="pCategory" required>
            <option>CPU</option><option>GPU</option><option>RAM</option>
            <option>Storage</option><option>Laptop</option><option>Peripherals</option>
          </select>
          <input id="pPrice" type="number" step="0.01" min="0" placeholder="Price" required>
          <input id="pStock" type="number" min="0" placeholder="Stock" required>
          <input id="pImage" type="file" accept="image/*" title="Product picture (optional when editing)">
          <button class="btn-ok" type="submit" id="saveBtn">Add Product</button>
          <button type="button" class="btn-cancel" id="cancelEdit" style="display:none">Cancel</button>
        </form>
      </div>
      <div class="card">
        <h2>Products</h2>
        <div class="scroll"><table>
          <thead><tr><th></th><th>ID</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead>
          <tbody id="inventoryBody"></tbody>
        </table></div>
      </div>
    </section>

    <section id="sales" class="panel">
      <div class="card">
        <h2>Sales History</h2>
        <div class="scroll"><table>
          <thead><tr><th>Sale #</th><th>Date</th><th>Items</th><th>Payment</th><th>Cashier</th><th>Discount</th><th>Total</th></tr></thead>
          <tbody id="salesBody"></tbody>
        </table></div>
      </div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
